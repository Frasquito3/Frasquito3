<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#cosmic-bg)" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="450" cy="160" r="220" fill="url(#nebula)" />

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="120" cy="60" r="1.5" />
    <circle cx="280" cy="110" r="1" />
    <circle cx="750" cy="80" r="1.5" />
    <circle cx="820" cy="220" r="1" />
    <circle cx="680" cy="250" r="1.2" />
    <circle cx="210" cy="230" r="1.5" />
    <circle cx="340" cy="40" r="1" />
    <circle cx="620" cy="70" r="1.8" />
  </g>

  <!-- Orbit Rings -->
  <ellipse cx="450" cy="160" rx="280" ry="85" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="4,6" opacity="0.4" />
  <ellipse cx="450" cy="160" rx="180" ry="55" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6,6" opacity="0.5" />
  <ellipse cx="450" cy="160" rx="90" ry="28" fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.6" />

  <!-- Central Star / Planet -->
  <circle cx="450" cy="160" r="24" fill="#6366F1" filter="url(#glow)" />
  <circle cx="450" cy="160" r="16" fill="#F8FAFC" />

  <!-- Planetary Bodies -->
  <g filter="url(#glow)">
    <circle cx="270" cy="160" r="9" fill="#38BDF8" />
    <circle cx="630" cy="160" r="12" fill="#EC4899" />
    <circle cx="530" cy="110" r="8" fill="#10B981" />
    <circle cx="360" cy="205" r="7" fill="#F59E0B" />
  </g>

  <!-- Content text -->
  <text x="450" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC" letter-spacing="1">
    ✦ GITHUB PROFILE COSMOS ✦
  </text>
  <text x="450" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    Ejecuta el workflow "Generate Profile Orbit" en Actions para mapear tus repositorios en tiempo real
  </text>
</svg>
